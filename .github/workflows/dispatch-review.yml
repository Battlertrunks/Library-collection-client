name: Test Ollama Review

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  test-ollama:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history so git diff works

      - name: Connect to Tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Extract Diff & Query Ollama
        id: ollama_review
        run: |
          OLLAMA_HOST="http://truenas-scale.tail89c53f.ts.net:30068"

          # 1. Read the guidelines from Markdown file
          PROMPT_FILE=".github/prompt-template.md"
          if [ -f "$PROMPT_FILE" ]; then
            SYSTEM_PROMPT=$(cat "$PROMPT_FILE")
          else
            SYSTEM_PROMPT="You are an expert AI code reviewer. Briefly review this git diff for bugs, performance issues, or security concerns."
          fi

          # 2. Extract git diff
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            DIFF=$(git diff origin/${{ github.base_ref }}..HEAD)
          else
            DIFF=$(git diff HEAD~1..HEAD)
          fi

          if [ -z "$DIFF" ]; then
            DIFF="No visible code changes."
          fi

          echo "Sending diff to Ollama..."

          # 3. Construct the JSON safety with jq and query Ollama
          RESPONSE=$(jq -n --arg diff "$DIFF" --arg template "$PROMPT_TEMPLATE" '{
            model: "gemma4:12b",
            prompt: ("$template + "\n\n### Git Diff to Review:\n\n" + $diff),
            stream: false
          }' | curl -s -X POST "$OLLAMA_HOST/api/generate" \
               -H "Content-Type: application/json" \
               -d @- | jq -r '.response')

          # Save output to Github Actions environment variable for subsequent steps
          {
            echo "OLLAMA_COMMENT<<EOF"
            echo "$RESPONSE"
            echo "EOF"
          } >> $GITHUB_ENV

      - name: Comment Review on Pull Request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const commentBody = `### Local Ollama Code Review\n\n${process.env.OLLAMA_COMMENT}\n\n---\n*Reviewed using local GPU pipeline via Tailscale.*`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: commentBody
            });
