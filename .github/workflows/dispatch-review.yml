name: Test Ollama Review

on:
  pull_request:
    types: [review_requested]
  issue_comment:
    types: [created]

jobs:
  gemma-reviewer:
    # Trigger if:
    # 1. PR requested a review specifically from the bot/user, OR
    # 2. Some typed "@ollama review" or "/review" in a PR comment

    # I should replace myself from this running, maybe add a bot or dummy
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '/review'))

    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      issues: read

    steps:
      # Step 1: Resolve PR branch details for issue_comment events
      - name: Resolve PR Details
        id: pr_details
        run: |
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            PR_JSON=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "${{ github.event.issue.pull_request.url }}")
            echo "HEAD_REF=$(echo "$PR_JSON" | jq -r '.head.ref')" >> $GITHUB_ENV
            echo "BASE_REF=$(echo "$PR_JSON" | jq -r '.base.ref')" >> $GITHUB_ENV
          else
            echo "HEAD_REF=${{ github.head_ref }}" >> $GITHUB_ENV
            echo "BASE_REF=${{ github.base_ref }}" >> $GITHUB_ENV
          fi

      # Checkout the PR's branch
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_REF }}
          fetch-depth: 0

      # Step 3: Explicitly fetch base branch for reliable diffing
      - name: Fetch Base Branch History
        run: |
          echo "Fetching base branch: ${{ env.BASE_REF }}"
          git fetch origin ${{ env.BASE_REF }}:${{ env.BASE_REF }} || git fetch origin ${{ env.BASE_REF }}

      - name: Connect to Tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Gather Diff & Existing File Context
        id: gather_context
        run: |
          # 1. Determine Target Base Branch (main)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="origin/${{ github.base_ref }}"
          else
            # For issue comments, fetch base branch via GitHub API
            BASE_BRANCH=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "${{ github.event.issue.pull_request.url }}" | jq -r '.base.ref')
            BASE_REF="origin/$BASE_BRANCH"
          fi

          # 2. Extract Git Diff
          DIFF=$(git diff $BASE_REF..HEAD)
          if [ -z "$DIFF" ]; then
            echo "No changes found."
            exit 0
          fi

          # 3. Gather full existing source context for modified files
          CHANGED_FILES=$(git diff --name-only $BASE_REF..HEAD)
          EXISTING_CONTEXT=""

          for file in $CHANGED_FILES; do
            if git show $BASE_REF:"$file" > /dev/null 2>&1; then
              CONTENT=$(git show $BASE_REF:"$file")
              EXISTING_CONTEXT="${EXISTING_CONTENT}\n--- FILE: $file (Base Branch) ---\n${CONTENT}\n"
            fi
          done

          # 4. Load Prompt Instructions
          PROMPT_FILE=".github/prompt-template.md"
          if [ -f "$PROMPT_FILE" ]; then
            SYSTEM_PROMPT=$(cat "$PROMPT_FILE")
          else
            SYSTEM_PROMPT="You are an expert AI code reviewer. Briefly review this git diff for bugs, performance issues, or security concerns."
          fi


          # 5. Query Ollama
          OLLAMA_HOST="http://truenas-scale.tail89c53f.ts.net:30068"
          echo "Sending context and diff to Ollama..."

          # 3. Construct the JSON safety with jq and query Ollama
          RESPONSE=$(jq -n \
            --arg diff "$DIFF" \
            --arg prompt "$SYSTEM_PROMPT" \
            --arg context "$EXISTING_CONTEXT" \
          '{
            model: "gemma4:12b",
            prompt: ($prompt + "\n\n### Existing Base Code Context:\n" + $context + "\n\n### Incoming Git Diff To Review:\n" + $diff),
            stream: false
          }' | curl -s -X POST "$OLLAMA_HOST/api/generate" \
               -H "Content-Type: application/json" \
               -d @- | jq -r '.response')

          # Save output to Github Actions environment variable for subsequent steps
          {
            echo "OLLAMA_COMMENT<<EOF"
            echo "$RESPONSE"
            echo "EOF"
          } >> $GITHUB_ENV

      - name: Comment Review on Pull Request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const commentBody = `### Gemma Code Review\n\n${process.env.OLLAMA_COMMENT}\n\n---\n*Reviewed using local GPU pipeline via Tailscale.*`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: commentBody
            });
