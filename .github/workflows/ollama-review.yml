name: Ollama Code Review
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 1: Connect GitHub Runner to your Tailnet
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # Step 2: Communicate with your local Ollama instance
      - name: Send Diff to Ollama
        run: |
          # Use your server's Tailscale IP or MagicDNS hostname
          curl -s http://truenas-scale.tail89c53f.ts.net:30068/api/generate \
            -d '{
              "model": "gemma4:12b",
              "prompt": "Review this pull request code diff and check for potential bugs..."
            }'
